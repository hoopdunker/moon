name: fetch_threat_feeds
description: >
  Fetches live threat feeds: CISA KEV (Known Exploited Vulnerabilities — CVEs
  confirmed exploited in the wild, with vendor, product, and remediation deadline)
  and DeFiLlama hacks (DeFi/Web3 protocol exploits with amount lost, chain, and
  attack technique, ranked by amount).
parameters:
  type: object
  properties:
    feed_type:
      type: string
      enum: [all, cisa_alerts, defi_hacks]
      description: Which feeds to pull. Defaults to all.
    max_items:
      type: integer
      description: Maximum items to return per feed (default 10).
    hours_back:
      type: integer
      description: Lookback window in hours (default 168 = 7 days).
  required: []
mock_response: |
  === CISA KEV (Actively Exploited — last 168h) ===
  CVE-2025-0282 | Ivanti — Connect Secure
    A stack-based buffer overflow in Ivanti Connect Secure allows a remote unauthenticated attacker to achieve remote code execution.
    Added: 2025-01-14 | Due: 2025-01-21

  CVE-2025-21333 | Microsoft — Windows Hyper-V
    Windows Hyper-V NT Kernel Integration VSP contains a heap-based buffer overflow allowing local privilege escalation to SYSTEM.
    Added: 2025-01-14 | Due: 2025-02-04

  === DeFiLlama — DeFi/Web3 Hacks (last 168h) ===
  Example Protocol | $12,400,000
    Chain: Ethereum | Type: Lending Protocol
    Attack: Smart Contract Exploit — Price oracle manipulation via flash loan

name: fetch_security_news
description: >
  Fetches the latest headlines from security news RSS/Atom feeds: general news,
  nation-state/APT intel, crypto breaches, vendor research blogs, vulnerability
  research, supply chain, cloud bulletins, patch advisories, breach tracking,
  geopolitical/threat research, and AI security. Returns formatted text per source.
parameters:
  type: object
  properties:
    sources:
      type: array
      items:
        type: string
      description: >
        List of source keys to fetch. Defaults to all sources if omitted.
        Categories — general: bleepingcomputer, hackernews (The Hacker News),
        krebsonsecurity, sans_isc, darkreading, securityweek. Nation-state/APT:
        recorded_future, mandiant, crowdstrike, microsoft_security, ncsc_uk.
        Crypto: chainalysis, cointelegraph_security, the_block, slowmist, coindesk,
        immunefi, elliptic, peckshield. Vendor research: unit42, talos,
        checkpoint_research, welivesecurity, securelist, sentinelone,
        elastic_security, rapid7. Vuln research: project_zero, zdi, exploit_db,
        portswigger_research, vuldb. Supply chain: sonatype, snyk, checkmarx,
        openssf, chainguard, stepsecurity. Cloud bulletins: aws_security,
        gcp_security, msrc_blog. Patch advisories: sap_security, ms_isac.
        Breach tracking: databreaches_net, securityaffairs, hipaa_journal.
        Geopolitical/threat research: the_record, cyberscoop, sekoia, huntress,
        lumu. AI security: trail_of_bits, wiz_research. Cloud/app security: upwind.
    max_items:
      type: integer
      description: >
        Maximum headlines to return per feed (default 5, max 20). Pass 0 for no
        cap — returns every item within the hours_back window (feeds carry ~20-50
        items, so use 0 with short windows like 24h).
  required: []
mock_response: |
  === Bleeping Computer ===
  [Tue, 14 Jan 2025] Critical RCE in Ivanti Connect Secure exploited in the wild
    Attackers are chaining CVE-2025-0282 and CVE-2025-0283 to deploy SPAWN malware on unpatched Ivanti gateways.
    https://www.bleepingcomputer.com/news/security/ivanti-connect-secure-rce/

  === Unit42 ===
  [Mon, 13 Jan 2025] Lazarus Group targets European defense contractors via LinkedIn
    North Korean APT uses fake recruiter personas to deliver BUNNYCARROT backdoor via trojanized coding challenges.
    https://unit42.paloaltonetworks.com/lazarus-linkedin-campaign/

  === Rekt News ===
  [Sun, 12 Jan 2025] Radiant Capital — $50M drained via compromised multisig
    Attackers compromised 3 of 11 multisig signers through targeted malware, draining Arbitrum and BSC pools.
    https://rekt.news/radiant-capital-rekt/

  === Project Zero ===
  [Fri, 10 Jan 2025] In-the-wild exploitation of Chrome V8 type confusion (CVE-2025-0117)
    Full exploit chain analysis: sandbox escape via renderer, kernel privilege escalation via GPU driver use-after-free.
    https://googleprojectzero.blogspot.com/2025/01/chrome-v8-type-confusion/

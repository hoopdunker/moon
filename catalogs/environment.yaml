# Moon Environment Profile
# ─────────────────────────────────────────────────────────────────────────────
# Drafted from observable infrastructure (AWS account 489922706493, infra repo,
# GitHub). Items marked TODO are guesses — correct them to your reality.
# ─────────────────────────────────────────────────────────────────────────────

org: Moon  # TODO: your org/operating name
industry: technology
employee_count: 1  # TODO: adjust if a team uses this

# ── Security Controls ────────────────────────────────────────────────────────
controls:
  network:
    - name: Cloudflare Access (Zero Trust)
      coverage: all public endpoints (moon.groot.work, intel.groot.work) — no direct ingress, cloudflared tunnel only
  identity:
    - name: AWS IAM
      coverage: scoped task roles for ECS; separate CI role via GitHub OIDC
  cloud:
    - name: AWS default account controls
      coverage: single account (489922706493), us-west-2 primary
  gaps:
    - No EDR/endpoint protection on developer machine  # TODO: confirm
    - No GuardDuty or CloudTrail alerting configured  # TODO: confirm
    - No SIEM — logs live in CloudWatch only
    - No dark web / credential-leak monitoring

# ── Log Sources ───────────────────────────────────────────────────────────────
log_sources:
  - AWS CloudWatch Logs (ECS container logs, us-west-2)
  - Cloudflare Access / tunnel logs
  - GitHub audit log (hoopdunker org)
  # TODO: enable + add CloudTrail and VPC Flow Logs if not already on

# ── Asset Inventory ───────────────────────────────────────────────────────────
assets:
  cloud:
    provider: AWS
    regions: [us-west-2, us-east-1]
    primary_services: [ECS Fargate, ECR, DynamoDB, S3, Secrets Manager, Bedrock, CloudWatch]
  critical_systems:
    - name: Moon orchestration service
      notes: ECS Fargate service `moon`, FastAPI + Bedrock; behind Cloudflare tunnel
    - name: Moon case store
      notes: DynamoDB table (moon_cases)
    - name: Terraform state
      notes: S3 bucket moon-tfstate-489922706493
    - name: GitHub repos and Actions pipeline
      notes: hoopdunker/moon deploys to prod on push to main — supply chain critical
  public_attack_surface:
    - moon.groot.work (Cloudflare Access-gated UI)
    - intel.groot.work (Cloudflare Access-gated intel dashboard)
  key_dependencies:
    - Python/PyPI packages (httpx, fastapi, boto3, typer)  # supply chain exposure
    - Docker base images
    - GitHub Actions (aws-actions/*)

# ── Compliance & Frameworks ───────────────────────────────────────────────────
compliance: []  # TODO: add if any apply

# ── Patch SLAs ────────────────────────────────────────────────────────────────
patch_slas:
  critical: 48 hours   # TODO: adjust to what you can realistically commit to
  high: 7 days
  medium: 30 days
